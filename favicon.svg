<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="faviconGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6c5ce7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#fd79a8;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="100" height="100" fill="#2d2d2d" rx="20"/>
  
  <!-- Letter C -->
  <path d="M 30,25 Q 20,25 20,35 L 20,65 Q 20,75 30,75 L 38,75 L 38,65 L 30,65 Q 28,65 28,63 L 28,37 Q 28,35 30,35 L 38,35 L 38,25 Z" 
        fill="#ffffff"/>
  
  <!-- Letter H - Left -->
  <rect x="48" y="25" width="8" height="50" fill="#ffffff"/>
  
  <!-- Letter H - Bar -->
  <rect x="48" y="45" width="24" height="8" fill="url(#faviconGradient)"/>
  
  <!-- Letter H - Right -->
  <rect x="64" y="25" width="8" height="50" fill="#ffffff"/>
  
  <!-- Accent dot -->
  <circle cx="85" cy="85" r="5" fill="url(#faviconGradient)"/>
</svg>