<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="profileBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6c5ce7"/>
      <stop offset="50%" style="stop-color:#8b7bff"/>
      <stop offset="100%" style="stop-color:#fd79a8"/>
    </linearGradient>
  </defs>
  
  <!-- Fondo gradiente -->
  <rect width="400" height="400" fill="url(#profileBg)"/>
  
  <!-- Grid decorativo -->
  <g opacity="0.08">
    <line x1="0" y1="100" x2="400" y2="100" stroke="#fff" stroke-width="2"/>
    <line x1="0" y1="200" x2="400" y2="200" stroke="#fff" stroke-width="2"/>
    <line x1="0" y1="300" x2="400" y2="300" stroke="#fff" stroke-width="2"/>
    <line x1="100" y1="0" x2="100" y2="400" stroke="#fff" stroke-width="2"/>
    <line x1="200" y1="0" x2="200" y2="400" stroke="#fff" stroke-width="2"/>
    <line x1="300" y1="0" x2="300" y2="400" stroke="#fff" stroke-width="2"/>
  </g>
  
  <!-- Hexágono grande de fondo -->
  <path d="M200,40 L320,100 L320,240 L200,300 L80,240 L80,100 Z" 
        fill="rgba(0,0,0,0.25)" 
        stroke="rgba(255,255,255,0.3)" 
        stroke-width="3"/>
  
  <!-- Silueta profesional -->
  <!-- Cabeza -->
  <circle cx="200" cy="145" r="50" fill="rgba(255,255,255,0.95)"/>
  
  <!-- Cuerpo -->
  <path d="M 120,290 Q 120,205 200,205 Q 280,205 280,290 L 280,340 L 120,340 Z" 
        fill="rgba(255,255,255,0.95)"/>
  
  <!-- Decoración tech - Brackets -->
  <text x="35" y="135" font-family="monospace" font-size="80" fill="rgba(255,255,255,0.15)" font-weight="bold">&lt;</text>
  <text x="330" y="135" font-family="monospace" font-size="80" fill="rgba(255,255,255,0.15)" font-weight="bold">/&gt;</text>
  
  <!-- Hexágono pequeño decorativo -->
  <path d="M350,50 L380,70 L380,110 L350,130 L320,110 L320,70 Z" 
        fill="none" 
        stroke="rgba(255,255,255,0.4)" 
        stroke-width="2"/>
  
  <!-- Barra inferior con info -->
  <rect x="0" y="350" width="400" height="50" fill="rgba(0,0,0,0.6)"/>
  <text x="200" y="375" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#ffffff" text-anchor="middle">CHRIS HUANG</text>
  <text x="200" y="393" font-family="Arial, sans-serif" font-size="14" fill="rgba(255,255,255,0.9)" text-anchor="middle">Software Engineer | Full Stack Developer</text>
</svg>
