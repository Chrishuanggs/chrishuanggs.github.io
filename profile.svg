<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6c5ce7"/>
      <stop offset="50%" style="stop-color:#8b7bff"/>
      <stop offset="100%" style="stop-color:#fd79a8"/>
    </linearGradient>
  </defs>
  
  <!-- Fondo -->
  <rect width="400" height="400" fill="url(#bg)"/>
  
  <!-- Grid sutil -->
  <g opacity="0.1">
    <line x1="0" y1="100" x2="400" y2="100" stroke="#fff" stroke-width="1"/>
    <line x1="0" y1="200" x2="400" y2="200" stroke="#fff" stroke-width="1"/>
    <line x1="0" y1="300" x2="400" y2="300" stroke="#fff" stroke-width="1"/>
    <line x1="100" y1="0" x2="100" y2="400" stroke="#fff" stroke-width="1"/>
    <line x1="200" y1="0" x2="200" y2="400" stroke="#fff" stroke-width="1"/>
    <line x1="300" y1="0" x2="300" y2="400" stroke="#fff" stroke-width="1"/>
  </g>
  
  <!-- Hexágono de fondo -->
  <path d="M200,60 L300,110 L300,230 L200,280 L100,230 L100,110 Z" 
        fill="rgba(0,0,0,0.3)" 
        stroke="rgba(255,255,255,0.2)" 
        stroke-width="2"/>
  
  <!-- Silueta de persona -->
  <circle cx="200" cy="150" r="45" fill="rgba(255,255,255,0.95)"/>
  <path d="M 130,280 Q 130,210 200,210 Q 270,210 270,280 L 270,330 L 130,330 Z" 
        fill="rgba(255,255,255,0.95)"/>
  
  <!-- Brackets decorativos -->
  <text x="50" y="140" font-family="monospace" font-size="70" fill="rgba(255,255,255,0.2)" font-weight="bold">&lt;</text>
  <text x="320" y="140" font-family="monospace" font-size="70" fill="rgba(255,255,255,0.2)" font-weight="bold">/&gt;</text>
  
  <!-- Barra inferior -->
  <rect x="0" y="350" width="400" height="50" fill="rgba(0,0,0,0.5)"/>
  <text x="200" y="375" font-family="Arial" font-size="20" font-weight="bold" fill="#fff" text-anchor="middle">CHRIS HUANG</text>
  <text x="200" y="393" font-family="Arial" font-size="13" fill="rgba(255,255,255,0.8)" text-anchor="middle">Software Engineer</text>
</svg>
