<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6c5ce7;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#8b7bff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#fd79a8;stop-opacity:1" />
    </linearGradient>
    <pattern id="grid" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="1" fill="rgba(255,255,255,0.1)"/>
      <line x1="0" y1="20" x2="40" y2="20" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
      <line x1="20" y1="0" x2="20" y2="40" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
    </pattern>
  </defs>
  
  <!-- Background -->
  <rect width="400" height="400" fill="url(#bgGrad)"/>
  <rect width="400" height="400" fill="url(#grid)"/>
  
  <!-- Hexagon background -->
  <path d="M200,50 L320,120 L320,260 L200,330 L80,260 L80,120 Z" 
        fill="rgba(0,0,0,0.3)" 
        stroke="rgba(255,255,255,0.2)" 
        stroke-width="2"/>
  
  <!-- Person silhouette -->
  <circle cx="200" cy="160" r="50" fill="rgba(255,255,255,0.95)"/>
  <path d="M 120,300 Q 120,220 200,220 Q 280,220 280,300 L 280,350 L 120,350 Z" 
        fill="rgba(255,255,255,0.95)"/>
  
  <!-- Code brackets decoration -->
  <text x="60" y="150" font-family="monospace" font-size="80" fill="rgba(255,255,255,0.2)" font-weight="bold">&lt;</text>
  <text x="310" y="150" font-family="monospace" font-size="80" fill="rgba(255,255,255,0.2)" font-weight="bold">/&gt;</text>
  
  <!-- Bottom bar with name -->
  <rect x="0" y="340" width="400" height="60" fill="rgba(0,0,0,0.4)"/>
  <text x="200" y="368" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">CHRIS HUANG</text>
  <text x="200" y="388" font-family="Arial, sans-serif" font-size="14" fill="rgba(255,255,255,0.8)" text-anchor="middle">Software Engineer</text>
</svg>
