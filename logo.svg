<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6c5ce7"/>
      <stop offset="100%" style="stop-color:#fd79a8"/>
    </linearGradient>
  </defs>
  
  <!-- Fondo circular -->
  <circle cx="100" cy="100" r="98" fill="#2d2d2d" stroke="url(#grad)" stroke-width="4"/>
  
  <!-- Hexágono decorativo -->
  <path d="M100,30 L160,60 L160,120 L100,150 L40,120 L40,60 Z" 
        fill="none" 
        stroke="url(#grad)" 
        stroke-width="2" 
        opacity="0.3"/>
  
  <!-- LETRA C -->
  <path d="M 70,65 
           C 60,65 55,70 55,80
           L 55,120
           C 55,130 60,135 70,135
           L 80,135
           L 80,125
           L 70,125
           C 67,125 65,123 65,120
           L 65,80
           C 65,77 67,75 70,75
           L 80,75
           L 80,65
           Z" 
        fill="#ffffff"/>
  
  <!-- LETRA H -->
  <!-- Línea izquierda -->
  <rect x="100" y="65" width="12" height="70" fill="#ffffff"/>
  
  <!-- Barra horizontal (con gradiente) -->
  <rect x="100" y="95" width="35" height="10" fill="url(#grad)"/>
  
  <!-- Línea derecha -->
  <rect x="123" y="65" width="12" height="70" fill="#ffffff"/>
</svg>
