<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6c5ce7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#fd79a8;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background hexagon -->
  <path d="M100,10 L170,50 L170,130 L100,170 L30,130 L30,50 Z" 
        fill="none" 
        stroke="url(#logoGradient)" 
        stroke-width="3" 
        opacity="0.3"/>
  
  <!-- Letter C -->
  <path d="M 75,50 
           Q 55,50 55,70
           L 55,110
           Q 55,130 75,130
           L 85,130
           L 85,115
           L 75,115
           Q 70,115 70,110
           L 70,70
           Q 70,65 75,65
           L 85,65
           L 85,50
           Z" 
        fill="#ffffff" 
        filter="url(#glow)">
    <animate attributeName="opacity" values="0.8;1;0.8" dur="2s" repeatCount="indefinite"/>
  </path>
  
  <!-- Letter H - Left vertical -->
  <rect x="100" y="50" width="15" height="80" 
        fill="#ffffff" 
        filter="url(#glow)">
    <animate attributeName="opacity" values="0.8;1;0.8" dur="2s" repeatCount="indefinite" begin="0.1s"/>
  </rect>
  
  <!-- Letter H - Horizontal bar -->
  <rect x="100" y="85" width="45" height="15" 
        fill="url(#logoGradient)" 
        filter="url(#glow)">
    <animate attributeName="opacity" values="0.8;1;0.8" dur="2s" repeatCount="indefinite" begin="0.2s"/>
  </rect>
  
  <!-- Letter H - Right vertical -->
  <rect x="130" y="50" width="15" height="80" 
        fill="#ffffff" 
        filter="url(#glow)">
    <animate attributeName="opacity" values="0.8;1;0.8" dur="2s" repeatCount="indefinite" begin="0.3s"/>
  </rect>
  
  <!-- Tech circuit lines -->
  <line x1="30" y1="50" x2="55" y2="50" 
        stroke="#6c5ce7" 
        stroke-width="2" 
        opacity="0.5">
    <animate attributeName="opacity" values="0.3;0.7;0.3" dur="3s" repeatCount="indefinite"/>
  </line>
  
  <line x1="145" y1="130" x2="170" y2="130" 
        stroke="#fd79a8" 
        stroke-width="2" 
        opacity="0.5">
    <animate attributeName="opacity" values="0.3;0.7;0.3" dur="3s" repeatCount="indefinite" begin="0.5s"/>
  </line>
  
  <!-- Tech nodes -->
  <circle cx="30" cy="50" r="3" fill="#6c5ce7">
    <animate attributeName="r" values="2;4;2" dur="2s" repeatCount="indefinite"/>
  </circle>
  
  <circle cx="170" cy="130" r="3" fill="#fd79a8">
    <animate attributeName="r" values="2;4;2" dur="2s" repeatCount="indefinite" begin="0.5s"/>
  </circle>
</svg>